name: Docker images

# Images go to Docker Hub (graphprotocol/graph-node, graphprotocol/graph-node-debug),
# where users and deployments pull them, and to ghcr.io under the same names.
#
# | Build                                     | Tags                       |
# |-------------------------------------------|----------------------------|
# | every build                               | 7-char short SHA           |
# | push to master                            | `nightly`                  |
# | push to hotfix/**                         | (short SHA only)           |
# | push of a `canary-*` tag                  | the tag, e.g. `canary-fix` |
# | release (called from release.yml)         | `vX.Y.Z`, `latest`         |
# | run by hand (workflow_dispatch)           | (short SHA only)           |
#
# Canary images replace the Cloud Build tag trigger: to get an image of a
# commit that isn't on master, push a tag `canary-<anything>` pointing at it.
on:
  push:
    branches: [master, "hotfix/**"]
    tags: ["canary-*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        type: string
        default: ""
    # release.yml passes it with `secrets: inherit`; the first step checks it.
    secrets:
      DOCKERHUB_CI_TOKEN:
        required: false

permissions:
  contents: read

env:
  # The organisation's Docker Hub token (org secret DOCKERHUB_CI_TOKEN) is an
  # organization access token, which logs in as the organisation.
  DOCKERHUB_USERNAME: graphprotocol

jobs:
  docker:
    name: Build and push images
    # The Dockerfile compiles graph-node in release mode, which needs the
    # cores and disk of a large runner.
    runs-on: nscloud-ubuntu-22.04-amd64-16x32
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # One build per ref at a time, in order; a newer push replaces a waiting
    # one. A release (tag_name set) has its own group, so a nightly can't
    # replace it.
    concurrency:
      group: docker-${{ inputs.tag_name || github.ref }}
      cancel-in-progress: false
    steps:
      # Docker Hub is where images are pulled from, so a build that can't push
      # there fails instead of quietly publishing to ghcr.io alone.
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_CI_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_CI_TOKEN" ]; then
            echo "::error::DOCKERHUB_CI_TOKEN is not available to this workflow" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.tag_name }}

      # A release is told apart by tag_name, not the event: called from
      # release.yml, the event is the caller's push to master.
      - name: Image metadata (graph-node)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            docker.io/graphprotocol/graph-node
            ghcr.io/graphprotocol/graph-node
          flavor: latest=false
          # Keep the tags of the two images the same.
          tags: |
            type=sha,prefix=
            type=raw,value=nightly,enable=${{ inputs.tag_name == '' && github.ref == 'refs/heads/master' }}
            type=raw,value=${{ github.ref_name }},enable=${{ inputs.tag_name == '' && startsWith(github.ref, 'refs/tags/canary-') }}
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=raw,value=latest,enable=${{ inputs.tag_name != '' }}

      - name: Image metadata (graph-node-debug)
        id: meta-debug
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            docker.io/graphprotocol/graph-node-debug
            ghcr.io/graphprotocol/graph-node-debug
          flavor: latest=false
          tags: |
            type=sha,prefix=
            type=raw,value=nightly,enable=${{ inputs.tag_name == '' && github.ref == 'refs/heads/master' }}
            type=raw,value=${{ github.ref_name }},enable=${{ inputs.tag_name == '' && startsWith(github.ref, 'refs/tags/canary-') }}
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=raw,value=latest,enable=${{ inputs.tag_name != '' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_CI_TOKEN }}

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images are built by one builder, so the graph-node-debug build
      # reuses the graph-node-build stage from its cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # context is set because the action's default is a git context of
      # github.sha, which is not the checked-out release tag. linux/amd64 only,
      # as Cloud Build built. The build args only fill /etc/image-info.
      - name: Build and push graph-node
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: graph-node
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            REPO_NAME=${{ github.event.repository.name }}
            BRANCH_NAME=${{ inputs.tag_name == '' && github.ref_type == 'branch' && github.ref_name || '' }}
            TAG_NAME=${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}

      - name: Build and push graph-node-debug
        id: build-debug
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: graph-node-debug
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-debug.outputs.tags }}
          labels: ${{ steps.meta-debug.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            REPO_NAME=${{ github.event.repository.name }}
            BRANCH_NAME=${{ inputs.tag_name == '' && github.ref_type == 'branch' && github.ref_name || '' }}
            TAG_NAME=${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}

      # Build provenance, stored with GitHub and pushed next to the ghcr.io
      # image. Both registries hold the same digest, so it verifies either:
      #   gh attestation verify oci://docker.io/graphprotocol/graph-node:<tag> -R graphprotocol/graph-node
      - name: Attest graph-node
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/graphprotocol/graph-node
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest graph-node-debug
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/graphprotocol/graph-node-debug
          subject-digest: ${{ steps.build-debug.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### graph-node images (${DIGEST})"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
