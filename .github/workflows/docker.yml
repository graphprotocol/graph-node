name: Docker images

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  docker:
    name: Build and push images
    # The Dockerfile compiles graph-node in release mode, which needs the
    # cores and disk of a large runner.
    runs-on: nscloud-ubuntu-22.04-amd64-16x32
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Docker Hub is pushed to only when its token is set; `if:` can't read
    # secrets directly.
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.tag_name }}

      # The same tags as the Cloud Build setup: the short SHA always, plus
      # `nightly` for master, or the release tag and `latest` for a release. A
      # release is told apart by tag_name, not the event: called from
      # release.yml, the event is the caller's push to master.
      - name: Image metadata (graph-node)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/graphprotocol/graph-node
            name=docker.io/graphprotocol/graph-node,enable=${{ env.DOCKERHUB_TOKEN != '' }}
          flavor: latest=false
          tags: &tags |
            type=sha,prefix=
            type=raw,value=nightly,enable=${{ inputs.tag_name == '' && github.ref == 'refs/heads/master' }}
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=raw,value=latest,enable=${{ inputs.tag_name != '' }}

      - name: Image metadata (graph-node-debug)
        id: meta-debug
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/graphprotocol/graph-node-debug
            name=docker.io/graphprotocol/graph-node-debug,enable=${{ env.DOCKERHUB_TOKEN != '' }}
          flavor: latest=false
          tags: *tags

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both images are built by one builder, so the graph-node-debug build
      # reuses the graph-node-build stage from its cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # context is set because the action's default is a git context of
      # github.sha, which is not the checked-out release tag. linux/amd64 only,
      # as Cloud Build built.
      - name: Build and push graph-node
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: graph-node
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: &build-args |
            COMMIT_SHA=${{ github.sha }}
            REPO_NAME=${{ github.event.repository.name }}
            BRANCH_NAME=${{ inputs.tag_name == '' && github.ref_name || '' }}
            TAG_NAME=${{ inputs.tag_name }}

      - name: Build and push graph-node-debug
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: graph-node-debug
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-debug.outputs.tags }}
          labels: ${{ steps.meta-debug.outputs.labels }}
          build-args: *build-args
