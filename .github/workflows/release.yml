name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened with GITHUB_TOKEN does not trigger workflows, so
      # the release PR is opened as the app instead.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarise
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        run: |
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo "Released $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PRS_CREATED" = "true" ]; then
            echo "Release PR created/updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  docker:
    name: Docker images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
